# =============================================================
# visualizer.conf - settings of bin/RiceVisualizer (super + alt + v)
#
# The spectrum of whatever is playing (everything that sounds through
# PipeWire / PulseAudio: Spotify, the browser, mpv, MPD...), in the
# colors of the theme in use. Edit and save: the widget reads this file
# again on its own (no restart needed).
#
# Lines starting with # or ; are comments.
# =============================================================

[spectrum]
# The look of the spectrum. Available:
#   bars     classic vertical bars with falling peaks (default)
#   mirror   bars reflected up and down from the middle
#   wave     the sound wave itself, a glowing line
#   radial   bars around a circle
#   dots     LED columns (equalizer of a hi-fi)
#   blocks   pixel blocks (retro)
#   terrain  a filled landscape of the frequencies
#   theme    the one that suits the theme in use (Pixel -> blocks...)
# Also changed with the keys 1-7 (and 0 = theme) over the window.
style = terrain

# Number of bars / columns (16 - 160), or auto: about one bar every 22 px,
# so a strip along the whole screen gets more bars. Fewer = wider bars.
bands = 56

# Size of the radial look: 1.0 = the whole circle fits the short side of
# the window; up to 3.0 (the bars run past the window's edge, nice on a
# wide strip); down to 0.3. Also + / - over the window (remembered).
radial_size = 1.0

# Inner circle of the radial, as a part of its size (0.1 - 0.9):
# smaller = longer bars, bigger = a wider ring.
radial_ring = 0.45

# Glow around the bars (yes / no). "no" costs less CPU.
glow = yes

# Colors: theme = the theme's accent gradient, palette = the palette's
# blue -> magenta -> cyan, or three hex colors low -> high, e.g.
#   colors = #00e5ff, #a24dff, #ff2bd6
colors = theme

# The sound to listen to: default = what plays through the speakers /
# headphones. Or a PulseAudio source name (pactl list short sources),
# e.g. alsa_output.pci-0000_00_1f.3.analog-stereo.monitor
device = default


[window]
# Background of the window: 0 = fully transparent (only the spectrum,
# floating over the desktop) ... 1 = the theme's panel, solid.
# Also changed with the mouse wheel over the window (remembered).
opacity = 0

# Width x height of the window when it opens.
width = 760
height = 240

# Frames per second (15 - 60).
fps = 60

# Where and how big it opens (also with the keys over the window):
#   window   a free window: drag it, resize it from any edge or corner  (W)
#   bottom   a strip standing on the bottom edge of the screen          (B)
#   top      a strip along the top edge, upside down: hanging down     (U)
#   screen   the whole screen                                           (F)
# Moving or resizing it by hand makes it a window again.
layout = bottom

# Height of the bottom / top strips, in px.
strip_height = 220

# Pinned (L): clicks go through it and it stays under every window, like
# a live wallpaper (best with opacity 0 and layout bottom or screen).
# While pinned it can't be clicked: super + alt + v closes it.
pinned = yes
