blur:

	{
		method = "gaussian";
		size = 4;
		deviation = 2.5;
	}

rules: (

	{
		blur-background = false;
		fade = false;
	},

	{
		match = "window_type = 'normal'
                && !(class_g = 'Rofi'
                    || class_g = 'Viewnior'
                    || class_g = 'mpv')";

        @include "picom-animations.conf"
		fade = true;	#-fade-switch
		shadow = true;	#-shadow-switch
		blur-background = true;	#-blur-switch
	},

	{
		match = "window_type = 'dialog'";
		fade = true;	#-fade-switch
		shadow = true;	#-shadow-switch
		blur-background = true;	#-blur-switch
	},

	{
		# Old-style active-opacity/inactive-opacity/opacity-rule are dead
		# once "rules" is in use (picom warns and ignores them). This is
		# the rule-based replacement, exactly as picom's own man page
		# recommends: `match = "focused"; opacity = ...;`.
		match = "(window_type = 'normal' || window_type = 'dialog')
                && focused
                && !(class_g = 'Rofi'
                    || class_g = 'Viewnior'
                    || class_g = 'mpv'
                    || class_g = 'retroarch')";
		opacity = 0.97;
	},

	{
		match = "(window_type = 'normal' || window_type = 'dialog')
                && !focused
                && !(class_g = 'Rofi'
                    || class_g = 'Viewnior'
                    || class_g = 'mpv'
                    || class_g = 'retroarch')";
		opacity = 0.92;
	},

	{
		match = "window_type = 'tooltip'";
		corner-radius = 0;
		opacity = 0.90;
	},

    {
		match = "fullscreen";
		corner-radius = 0;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
		corner-radius = 0;
        shadow = false;
	},

## ----- Single apps rules ----- ##

    {
        match = "class_g = 'Dunst'";
        @include "picom-dunst-animations.conf"
        shadow = false;
        corner-radius = 0;
    },

    {
        match = "class_g = 'bspwm-scratch' || class_i = 'bspwm-scratch'";
            animations = (

                {
                    triggers = ["close", "hide"];
                    preset = "fly-out";
                    direction = "up";
                    duration = 0.3;
                },

                {
                    triggers = ["open", "show"];
                    preset = "fly-in";
                    direction = "up";
                    duration = 0.3;
                }
            )
        corner-radius = 0;
        shadow = false;
		blur-background = true;	#-blur-switch
    },

    {
        match = "name = 'Eww - bar'     || "
                "class_g = 'Polybar'    || "
                "window_type = 'dock'   || "
                "class_g = 'Eww'";
        fade = true;
        corner-radius = 0;
        shadow = false;
    },

    {
        match = "class_g = 'jgmenu'";
            animations = (

                {
                    triggers = ["close", "hide"];
                    preset = "disappear";
                    duration = 0.08;
                    scale = 0.5;
                },

                {
                    triggers = ["open", "show"];
                    preset = "appear";
                    duration = 0.08;
                    scale = 0.5;
                }
            )
        shadow = false;
        corner-radius = 0;
    },

	{
        match = "name = 'Eww - launchermenu'";
            animations = (

                {
                    triggers = ["close", "hide"];
                    preset = "slide-out";
                    direction = "right";
                    duration = 0.2;
                },

                {

                    triggers = ["open", "show"];
                    preset = "slide-in";
                    direction = "right";
                    duration = 0.2;
                }
            )
    },

    {
        match = "name = 'Eww - music'";
            animations = (

                {
                    triggers = ["close", "hide"];
                    preset = "slide-out";
                    direction = "down";
                    duration = 0.3;
                },

                {
                    triggers = ["open", "show"];
                    preset = "slide-in";
                    direction = "up";
                    duration = 0.3;
                }
            )
    },

    {
        match = "name = 'Eww - csheet'";
            animations = (

                {
                    triggers = ["close", "hide"];
                    preset = "disappear";
                    duration = 0.3;
                    scale = 0.5;
                },

                {
                    triggers = ["open", "show"];
                    preset = "appear";
                    duration = 0.3;
                    scale = 0.5;
                }
            )
    },

	{
		match = "class_g = 'firefox'		|| "
				"class_g = 'Screenkey'		|| "
				"_GTK_FRAME_EXTENTS@";
		shadow = false;
	},

    {
		match = "class_g = 'Viewnior'       || "
				"class_g = 'mpv'            || "
				"class_g = 'retroarch'";
		corner-radius = 0;
		fade = true;	#-fade-switch
        shadow = false;
	},

    {
        # Rofi gets the same floating-HUD treatment as real windows
        # (rounded to match its own window { border-radius } and a
        # soft shadow), but stays fully opaque -- no opacity rule
        # matches it above, so it keeps the implicit 1.0 default and
        # menu text never gets blurry.
        match = "class_g = 'Rofi'";
        corner-radius = 14;
        fade = true;	#-fade-switch
        shadow = true;
        blur-background = true;	#-blur-switch
    }
)
