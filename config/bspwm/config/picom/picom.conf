## ----- General Settings ----- ##

# Available backends "xrender" "glx" "egl"
backend = "glx";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "error";

## ----- Shadows ----- ##

# Base default (per-window type still wins via picom-rules.conf); a soft,
# deep-set shadow behind every real window is what actually sells the
# "floating panes" look instead of flat cutouts on the wallpaper.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#000000"

## ----- Fading ----- ##

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- Transparency ----- ##

# A small amount of see-through on real app windows only -- bars, rofi,
# eww, dunst and menus are forced back to fully opaque in opacity-rule
# below so chrome text/icons never lose contrast.
frame-opacity = 1.0;
active-opacity = 0.97;
inactive-opacity = 0.92;
#inactive-dim-fixed = true

opacity-rule = [
    "100:window_type = 'dock'",
    "100:window_type = 'desktop'",
    "100:window_type = 'toolbar'",
    "100:window_type = 'menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'popup_menu'",
    "100:class_g = 'Polybar'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'Eww'",
    "100:class_g = 'jgmenu'",
    "100:class_g = 'Dunst'",
    "100:class_g = 'mpv'",
    "100:class_g = 'retroarch'",
    "100:class_g = 'Viewnior'"
];

## ----- Corners ----- ##

corner-radius = 10

## ----- Rules ----- ##

@include "picom-rules.conf"
