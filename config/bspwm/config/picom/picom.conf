## ----- General Settings ----- ##

# Available backends "xrender" "glx" "egl"
backend = "glx";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "error";

## ----- Shadows ----- ##

# Base default (per-window type still wins via picom-rules.conf); a soft,
# deep-set shadow behind every real window is what actually sells the
# "floating panes" look instead of flat cutouts on the wallpaper.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#000000"

## ----- Fading ----- ##

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- Transparency ----- ##

# NOTE: "active-opacity"/"inactive-opacity"/"opacity-rule" are picom's
# *old-style* options -- they are silently ignored (with a startup
# warning) as soon as a "rules" list is in use, which picom-rules.conf
# below does. Per-window opacity for real app windows lives there now,
# as `match = "focused"; opacity = ...;` rules (the syntax picom's own
# man page recommends replacing opacity-rule with). Bars/rofi/eww/dunst/
# menus are simply never given an opacity rule, so they stay at the
# implicit 1.0 default -- no explicit "100%" override needed.
frame-opacity = 1.0;
#inactive-dim-fixed = true

## ----- Corners ----- ##

corner-radius = 10

## ----- Rules ----- ##

@include "picom-rules.conf"
