    // Used instead of picom-animations.conf while windows wear a theme
    // frame (WIN_SKIN, config/modules/00-picom.sh). The frame, the themed
    // background and the shape of each window (bin/RoundBorders) follow
    // its real geometry: scaling or sliding the window on the screen would
    // leave them behind (frames floating off the window, cut content), so
    // here windows only fade in and out and never animate size/position.
    animations = (

        {
            triggers = ["close"];
            opacity = {
                curve = "cubic-bezier(0,1,1,1)";
                duration = 0.18;
                start = "window-raw-opacity-before";
                end = 0;
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";
        },

        {
            triggers = ["open"];
            opacity = {
                curve = "cubic-bezier(0,1,1,1)";
                duration = 0.18;
                start = 0;
                end = "window-raw-opacity";
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";
        },

        {
            triggers = ["show"];
            opacity = {
                curve = "linear";
                duration = 0.06;
                start = 0;
                end = "window-raw-opacity";
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";
        },

        {
            triggers = ["hide"];
            opacity = {
                duration = 0.01;
                start = 0;
                end = 0;
            };
            blur-opacity = "opacity";
            shadow-opacity = "opacity";
        }
    )
