# =============================================================
# lyrics.conf - settings of bin/RiceLyrics (super + alt + y)
#
# The lyrics of the song playing right now, line by line in time with
# the music. Sources are tried in the order of [sources] until one has
# the song: LRCLIB first (free, no key, synced lyrics), then Musixmatch
# (only with a user token or API key below), then lyrics.ovh (free,
# plain text only).
#
# Lines starting with # or ; are comments. Edit and save: the widget
# reads this file again on its own (no restart needed).
# =============================================================

[sources]
# Order of the sources, separated by commas. Leave out the ones you
# don't want. Available: musixmatch, lrclib, lyricsovh
order = lrclib, musixmatch, lyricsovh


[musixmatch]
# Musixmatch can be used in two ways. Fill in ONE of them (or both: the
# user token is tried first). With neither, Musixmatch is skipped and
# the next source is used.
#
# 1) USER TOKEN (recommended: synced lyrics, free)
#    The token the Musixmatch desktop / web app uses. To get yours:
#      - open https://www.musixmatch.com in the browser and sign in
#      - open the developer tools (F12) -> Network tab
#      - play any song's lyrics page and look for a request to
#        apic-desktop.musixmatch.com or apic.musixmatch.com
#      - copy the value of its "usertoken" parameter here
#    It looks like: 2005218b74f939209bda92cb633c7380612e14cb7fe92dcd6a780f
usertoken =

# 2) API KEY (the official developer API)
#    Sign up at https://developer.musixmatch.com, create an application
#    and copy its API key here. The free plan gives the plain lyrics (only
#    part of them on some songs) and no timing: they are spread over the
#    song. The synced lyrics (track.subtitle.get) need a paid plan.
#    Endpoint used: https://api.musixmatch.com/ws/1.1/
apikey =

# Endpoints (change only if Musixmatch moves them)
desktop_api = https://apic-desktop.musixmatch.com/ws/1.1/
official_api = https://api.musixmatch.com/ws/1.1/


[lrclib]
# https://lrclib.net - open database of synced lyrics, no key needed.
api = https://lrclib.net/api/


[lyricsovh]
# https://lyrics.ovh - plain lyrics, no key needed (no timing: the lines
# are spread over the length of the song).
api = https://api.lyrics.ovh/v1/


[window]
# Background of the window: 0 = fully transparent (only the lyrics,
# glowing over the desktop) ... 1 = the theme's panel, solid.
# Also changed with the mouse wheel over the window (saved for you).
opacity = 0.85

# Size of the current line, in points (the others are smaller).
font_size = 20

# Lines shown before and after the current one.
context = 3

# Width x height of the window when it opens.
width = 620
height = 400

# Karaoke fill: the current line lights up word by word (yes / no).
karaoke = yes

# Seconds added to the player's position: + if the lyrics come late,
# - if they come early. Also changed with the Up / Down arrows.
offset = 0.0
