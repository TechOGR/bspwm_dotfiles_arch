[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
format-foreground = ${color.fg}
format-underline = ${color.blue-gray}
date-alt = "%a, %d %b %Y"

format = <label>
format-background = ${pod.bg}
format-prefix =
format-prefix-font = 2
format-prefix-foreground = ${color.blue-gray}

label = "%time%%date%"

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-background = ${pod.bg}
format-mounted-prefix = " "
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${color.teal}
format-mounted-underline = ${color.teal}

format-unmounted = <label-unmounted>
format-unmounted-background = ${pod.bg}
format-unmounted-prefix-font = 2
format-unmounted-prefix = " "

label-mounted = %used%

label-unmounted = %mountpoint%: not mounted

######################################################

[module/network]
type = custom/script
exec = NetworkPolybar
tail = true

format = <label>
format-background = ${pod.bg}
format-underline = ${color.green}
label = %output%

; left: network manager · right: full / compact / name view
click-left = OpenApps --netmanager
click-right = NetworkPolybar --cycle

######################################################

[module/pulseaudio]
type = internal/pulseaudio

;;sink = alsa_output.pci-0000_00_1b.0.analog-stereo
use-ui-max = true
interval = 5

format-volume = <label-volume>
format-volume-background = ${pod.bg}
format-volume-prefix = ""
format-volume-prefix-font = 2
format-volume-foreground = ${color.indigo}
format-volume-underline = ${color.indigo}

label-volume = " %percentage% "
label-volume-foreground = ${color.fg}

format-muted = <label-muted>
format-muted-background = ${pod.bg}
format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-foreground = ${color.indigo}
format-muted-underline = ${color.red}
label-muted = " Muted "
label-muted-foreground = ${color.red}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 

click-right = OpenApps --soundcontrol

######################################################

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false
format-underline = ${color.yellow}

format = <ramp><label>
format-background = ${pod.bg}
label = %percentage%%
label-padding-left = 3pt

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging><label-charging>
format-charging-background = ${pod.bg}
format-charging-underline = ${color.green}
label-charging = %percentage%%
label-charging-padding-left = 3pt
label-charging-padding-right = 7pt

format-discharging = <ramp-capacity><label-discharging>
format-discharging-background = ${pod.bg}
format-discharging-underline = ${color.blue}
label-discharging = %percentage%%
label-discharging-padding-left = 3pt
label-discharging-padding-right = 7pt

format-full = <label-full>
format-full-background = ${pod.bg}
format-full-underline = ${color.green}
format-full-prefix = 
format-full-prefix-font = 2
format-full-prefix-foreground = ${color.green}
label-full = %percentage%%
label-full-padding-left = 3pt
label-full-padding-right = 7pt

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.blue}
ramp-capacity-font = 2

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${color.green}
animation-charging-font = 2
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
format-background = ${pod.bg}
label = " %output% "

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-background = ${pod.bg}
format-font = 3

label-focused = 󰮯
label-focused-padding = 1
label-focused-underline = ${color.yellow}
label-focused-foreground = ${color.yellow}

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-underline = ${color.blue}
label-occupied-foreground= ${color.blue}

label-urgent = 󰊠
label-urgent-padding = 1
label-urgent-underline = ${color.red}
label-urgent-foreground= ${color.blue}

label-empty = 󰑊
label-empty-padding = 1
label-empty-underline = ${color.purple}
label-empty-foreground = ${color.purple}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-background = ${pod.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.lime}
format-underline = ${color.lime}

label = %output%

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = 󰣇
label-foreground = ${color.blue-arch}
label-font = 3
label-overline = ${color.blue-arch}
label-padding = 2

click-left = OpenApps --menu

######################################################

; [module/sep], [module/gap] and the pill caps are generated in bar.ini
format-background = ${pod.bg}

[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 3
label-foreground = ${color.blue-gray}

######################################################
format-background = ${pod.bg}

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-background = ${pod.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.red}

label = "%percentage%%"

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label> <bar-used>
format-background = ${pod.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.cyan}

; polybar only expands ${color.x} when it is the whole value, so no
; inline %{F${color.x}} here (that printed a stray "}}")
label = %percentage_used%%  %gb_used% / %gb_total%

bar-used-width = 6
bar-used-indicator =
bar-used-fill = ━
bar-used-fill-foreground = ${color.cyan}
bar-used-empty = ━
bar-used-empty-foreground = ${color.trace}

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2
format-online   = <icon-prev><toggle><icon-next>
format-online-background = ${pod.bg}
format-offline  = <label-offline>
format-offline-background = ${pod.bg}
label-offline = "󰝛 No Music"
icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = "%{T2} "
icon-next               = " %{T2}"

format-offline-foreground = ${color.grey}
icon-play-foreground    = ${color.lime}
icon-pause-foreground   = ${color.lime}
icon-stop-foreground    = ${color.lime}
icon-prev-foreground    = ${color.blue}
icon-next-foreground    = ${color.blue}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

[module/mpd]
type                    = internal/mpd
host                    = 127.0.0.1
port                    = 6600
interval        		= 2
format-online           = "%{A1:OpenApps --music:}󰎈 <label-song>%{A}"
format-online-background = ${pod.bg}
format-offline          = ""
format-offline-background = ${pod.bg}
label-song              = "%title%"
label-song-maxlen		= 18
icon-repeat             = ""
icon-repeat-font		= 2

icon-repeat-background  = ${color.bg}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

#####################################################

[module/mplayer]
type = custom/text
label = ""
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music
format-background = ${pod.bg}

[module/usercard]
type = custom/text
label =  ""
label-foreground = ${color.cyan}

click-left = OpenApps --usercard
format-background = ${pod.bg}

[module/power]
type = custom/text
label = ""
label-foreground = ${color.red}
label-padding = 2

click-left = OpenApps --powermenu
format-overline = ${color.red}

#####################################################
format-background = ${pod.bg}

[module/tray]
type = internal/tray

format = <tray>
format-background = ${pod.bg}
tray-background = ${pod.bg}
tray-foreground = ${color.fg}
tray-spacing = 8px
tray-padding = 0px
tray-size = 63%
format-underline = ${color.cyan}

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-background = ${pod.bg}
format-font = 3
label = "%output%"
format-underline = ${color.blue}
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-background = ${pod.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.cyan}

format-underline = ${color.cyan}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-foreground = ${color.green}
click-left = Colorpicker

#####################################################
# ----- Futuristic / animated modules ----- #
#####################################################
format-background = ${pod.bg}

[module/heartbeat]
type = custom/script
exec = HeartbeatPolybar 7dcfff
interval = 0.2
format = <label>
format-background = ${pod.bg}
format-underline = ${color.cyan}
label = %output%
click-left = ModulesList

[module/cpu_wave]
type = internal/cpu
interval = 1

format = <label>
format-background = ${pod.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.red}

label = %percentage%%

[module/sensors_temp]
type = custom/script
exec = SensorsTempPolybar
interval = 3
format = <label>
format-background = ${pod.bg}
label = %output%

[module/gpu]
type = custom/script
exec = GpuStatusPolybar
interval = 3
format = <label>
format-background = ${pod.bg}
label = %output%

[module/uptime]
type = custom/script
exec = UptimePolybar
interval = 30
format = <label>
format-background = ${pod.bg}
format-foreground = ${color.teal}
format-underline = ${color.teal}
label = %output%

[module/song_wave]
type = custom/script
exec = SongWavePolybar
interval = 1
format = <label>
format-background = ${pod.bg}
label = %output%
click-left = OpenApps --player
click-right = OpenApps --music

[module/modules_help]
type = custom/text
label = ""
label-foreground = ${color.pink}
label-padding = 2
click-left = ModulesList

######################################################
# ----- New functional modules ----- #
######################################################
format-background = ${pod.bg}

[module/mic]
type = custom/script
exec = MicPolybar
interval = 2
click-left = MicPolybar --toggle
format = <label>
format-background = ${pod.bg}
format-underline = ${color.pink}
label = %output%

[module/caffeine]
type = custom/script
exec = CaffeinePolybar
interval = 5
click-left = CaffeinePolybar --toggle
format = <label>
format-background = ${pod.bg}
format-underline = ${color.amber}
label = %output%
label-padding = 2

[module/clipboard]
type = custom/text
label = "󰅍"
label-foreground = ${color.purple}
label-padding = 4
click-left = OpenApps --clipboard
format-background = ${pod.bg}

[module/screenshot]
type = custom/text
label = "󰹑"
label-foreground = ${color.purple}
label-padding = 2
; left: capture HUD · middle: this monitor · right: region to clipboard
click-left = OpenApps --screenshot
click-middle = ScreenShoTer --screen
click-right = ScreenShoTer --region
format-background = ${pod.bg}

[module/sysmonitor]
type = custom/text
label = "󰨇"
label-foreground = ${color.orange}
label-padding = 4
click-left = OpenApps --sysmonitor
format-background = ${pod.bg}

