[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #1A1B26
fg = #F1F1F1
mb = #222330

red = #f7768e
pink = #FF0677
purple = #583794
blue = #7aa2f7
blue-arch = #0A9CF5
cyan = #7dcfff
teal = #00B19F
green = #9ece6a
lime = #B9C244
yellow = #e0af68
amber = #FBC02D
orange = #E57C46
brown = #AC8476
grey = #8C8C8C
indigo = #6C77BB
blue-gray = #6D8895
trace = #33354A

[bar/emi-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
; Adaptive centering: the workspace pill centers itself in whatever space
; is actually left between modules-left/modules-right, instead of pinning
; to the bar's absolute midpoint. With `true` the left/right gaps around
; it end up wildly uneven whenever one side has more live content than
; the other (which changes constantly with real data).
fixed-center = false

width = 99.5%
height = 28

offset-x = 0.25%
offset-y = 8

background = ${color.bg}
foreground = ${color.fg}

; Rounded "capsule" shape for a softer, more futuristic silhouette
radius = 14.0

line-size = 2
line-color = ${color.blue}

; Thin neon outline instead of the old flat background-colored frame
border-size = 2px
border-color = ${color.cyan}

padding = 4

module-margin-left = 0
module-margin-right = 0

; Global glow thickness for the per-module format-underline/format-overline
; accents below -- each chip gets its own status color, this just sets how
; thick that neon line renders.
underline-size = 2
overline-size = 2

; Text
font-0 = "JetBrainsMono:style=Bold:pixelsize=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;4"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:pixelsize=17;4"
;dpi = 96

; Modules available but not active by default:
;   brightness   weather   xkeyboard   colorpicker   cpu_bar   mpd   mplayer
; Press super + alt + m (or click the  icon) to browse/toggle all of them.
modules-left = launcher dots heartbeat sep cpu_wave sep memory_bar sep filesystem sep sensors_temp gpu sep uptime
modules-center = bspwm
modules-right = song_wave sep mic sep bluetooth sep network sep pulseaudio sep battery sep clipboard screenshot sysmonitor sep updates sep date sep tray sep caffeine sep modules_help sep power

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
