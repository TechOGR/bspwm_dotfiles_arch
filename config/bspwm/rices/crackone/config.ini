[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #1A1B26
fg = #F1F1F1
mb = #222330

red = #f7768e
pink = #FF0677
purple = #583794
blue = #7aa2f7
blue-arch = #0A9CF5
cyan = #7dcfff
teal = #00B19F
green = #9ece6a
lime = #B9C244
yellow = #e0af68
amber = #FBC02D
orange = #E57C46
brown = #AC8476
grey = #8C8C8C
indigo = #6C77BB
blue-gray = #6D8895
trace = #33354A

[bar/emi-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
; The workspace switcher is pinned dead-center on the bar's absolute
; midpoint, not just centered in whatever space is left between the
; other modules.
fixed-center = true

width = 99.5%
height = 30

offset-x = 0.25%
offset-y = 8

background = ${color.bg}
foreground = ${color.fg}

; Rounded "capsule" shape for a softer, more futuristic silhouette
radius = 14.0

line-size = 2
line-color = ${color.blue}

; Thin neon outline instead of the old flat background-colored frame
border-size = 2px
border-color = ${color.cyan}

padding = 6

; A single consistent gap before every module instead of chip
; backgrounds/dividers doing the separating -- fewer, calmer modules
; read as "floating" icons on the glass bar rather than a row of
; boxes, which is what actually makes it feel premium.
module-margin-left = 14
module-margin-right = 0

; Global glow thickness for the per-module format-underline/format-overline
; accents below -- each chip gets its own status color, this just sets how
; thick that neon line renders.
underline-size = 2
overline-size = 2

; Text
font-0 = "JetBrainsMono:style=Bold:pixelsize=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;4"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:pixelsize=17;4"
;dpi = 96

; Kept deliberately short -- everything else (temp/GPU/uptime,
; bluetooth, now-playing, updates, mic, caffeine, quick-launch icons,
; tray, battery...) is still defined in modules.ini and a click away
; via super + alt + m (or the  icon), it's just not cluttering the
; bar by default anymore.
modules-left = launcher cpu_wave memory_bar filesystem
modules-center = bspwm
modules-right = pulseaudio network date caffeine modules_help power

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
