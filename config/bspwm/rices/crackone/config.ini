[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #1A1B26
fg = #F1F1F1
mb = #222330

red = #f7768e
pink = #FF0677
purple = #583794
blue = #7aa2f7
blue-arch = #0A9CF5
cyan = #7dcfff
teal = #00B19F
green = #9ece6a
lime = #B9C244
yellow = #e0af68
amber = #FBC02D
orange = #E57C46
brown = #AC8476
grey = #8C8C8C
indigo = #6C77BB
blue-gray = #6D8895
trace = #33354A

[bar/emi-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
; The workspace switcher is pinned dead-center on the bar's absolute
; midpoint, not just centered in whatever space is left between the
; other modules.
fixed-center = true

width = 99.5%
height = 30

offset-x = 0.25%
offset-y = 8

background = ${color.bg}
foreground = ${color.fg}

; Rounded "capsule" shape for a softer, more futuristic silhouette
radius = 16.0

line-size = 2
line-color = ${color.blue}

; No frame border -- at 2px width the pale cyan read as a washed-out
; whitish outline sitting right above the modules instead of a crisp
; neon line, so the bar now just floats on its own background/radius.
border-size = 0px

padding = 5

; No default gap left -- modules within each side now sit right next
; to each other, and the only thing marking a boundary between them
; is the thin "sep" divider line inserted explicitly where needed
; (see modules-left/modules-right below). Standalone buttons get
; their own label-padding instead, so spacing is deliberate everywhere
; rather than one uniform margin.
module-margin-left = 0
module-margin-right = 0

; Underline/overline accents disabled -- at 2px they read as a hazy,
; semi-transparent glow sitting on every module (like a permanent
; focus/hover ring) rather than a crisp line. Modules keep just their
; icon + text now; color alone (icon tint) still carries status.
underline-size = 0
overline-size = 0

; Text
font-0 = "JetBrainsMono:style=Bold:pixelsize=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;4"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:pixelsize=17;4"
;dpi = 96

; Exactly 4 groups, flex-style: big blank gaps BETWEEN groups, thin
; "sep" line dividers only WITHIN a group.
;   1. launcher, alone
;   2. cpu_wave + memory_bar + filesystem, joined
;   3. bspwm (workspaces), dead-center (fixed-center above)
;   4. network + pulseaudio + date + caffeine + screenshot +
;      modules_help + power, all joined end to end
; Everything else (temp/GPU/uptime, bluetooth, now-playing, updates,
; mic, clipboard/sysmonitor, tray, battery...) is still defined in
; modules.ini and a click away via super + alt + m (or the  icon).
modules-left = launcher gap cpu_wave sep memory_bar sep filesystem
modules-center = bspwm
modules-right = network sep pulseaudio sep date caffeine screenshot modules_help power

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
