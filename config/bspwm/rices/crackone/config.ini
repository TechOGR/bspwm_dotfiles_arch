[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
; ---------------------------------------------------------------------
; Cyberpunk / neon HUD palette
; Ultra-dark semi-transparent glass (bg/mb carry an alpha channel,
; format #AARRGGBB) with a cyan/magenta/electric-blue neon accent
; system and yellow/red for warnings & alerts.
; NOTE: `blue` and `grey` are parsed literally (regex `^blue =`,
; `^grey =`) by bin/bluetooth-polybar.sh - keep those two keys as a
; single plain hex token with no trailing comment on the line.
; ---------------------------------------------------------------------
bg = #E60A0B16
fg = #E8EAFF
mb = #CC12142C

red = #FF2D55
pink = #FF2EC4
purple = #9D4EFF
blue = #3E7BFF
blue-arch = #23D5FF
cyan = #00F0FF
teal = #00E6C3
green = #39FF8C
lime = #B6FF3D
yellow = #FFE347
amber = #FFB020
orange = #FF7A33
brown = #C97C5D
grey = #7A80A0
indigo = #8C6CFF
blue-gray = #5C6390

[bar/emi-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
; Adaptive centering: the workspace pill centers itself in whatever space
; is actually left between modules-left/modules-right, instead of pinning
; to the bar's absolute midpoint. With `true` the left/right gaps around
; it end up wildly uneven whenever one side has more live content than
; the other (which changes constantly with real data).
fixed-center = false

width = 99.5%
height = 28

offset-x = 0.25%
offset-y = 8

background = ${color.bg}
foreground = ${color.fg}

; Rounded "capsule" shape for a softer, more futuristic silhouette
radius = 14.0

line-size = 2
line-color = ${color.cyan}

; Underline thickness for the workspace-glow effect (module/bspwm
; sets its own label-*-underline colors below)
underline-size = 2

; Thin neon outline instead of the old flat background-colored frame
border-size = 2px
border-color = ${color.cyan}

padding = 4

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono:style=Bold:pixelsize=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;4"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:pixelsize=17;4"
;dpi = 96

; Modules available but not active by default:
;   brightness   weather   xkeyboard   colorpicker   cpu_bar   mpd   mplayer
; Press super + alt + m (or click the  icon) to browse/toggle all of them.
modules-left = launcher dots heartbeat sep bi cpu_wave bd sep bi memory_bar bd sep bi filesystem bd sep bi sensors_temp gpu bd sep bi uptime bd sep
modules-center = bi bspwm bd
modules-right = bi song_wave bd sep bluetooth sep bi network bd sep bi pulseaudio bd sep bi battery bd sep bi updates bd sep bi date bd sep tray sep modules_help sep power

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
