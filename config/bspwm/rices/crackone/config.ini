[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
; Colors are generated from the active palette (config/modules/06-polybar.sh)
include-file = colors.ini
; Bar look + module lists, generated by BarCtl (RiceEditor -> Polybar)
include-file = bar.ini

[bar/emi-bar]
; Size, position, colors, style and the module lists come from bar.ini,
; generated by BarCtl from config/polybar.json: edit them in
; RiceEditor -> Polybar (or ModulesList for the modules).
inherit = bar/look

monitor = ${env:MONITOR:}
monitor-strict = false
; override-redirect / wm-restack are in bar.ini: with auto-hide the bar
; floats over the windows instead of reserving space

; The workspace switcher is pinned dead-center on the bar's absolute
; midpoint, not just centered in whatever space is left between the
; other modules.
fixed-center = true

line-size = 2
line-color = ${color.blue}

; Modules sit right next to each other; the "sep" divider (or the pill
; caps of the Islands / Cyber styles) mark the boundaries.
module-margin-left = 0
module-margin-right = 0

underline-size = 0
overline-size = 0

; Text
font-0 = "JetBrainsMono:style=Bold:pixelsize=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;4"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:pixelsize=17;4"
; font-5 (pill caps, sized to the bar height) is in bar.ini
;dpi = 96

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
