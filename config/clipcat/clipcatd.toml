daemonize = true
pid_file = "/run/user/1000/clipcatd.pid"
primary_threshold_ms = 5000
max_history = 50
synchronize_selection_with_clipboard = true
# private: /tmp could be read by other users; the runtime dir is 0700 and in RAM
history_file_path = "/run/user/1000/clipcat/history"
snippets = []

[log]
emit_journald = false
emit_stdout = false
emit_stderr = false
level = "INFO"

[watcher]
enable_clipboard = true
enable_primary = true
enable_secondary = false
sensitive_x11_atoms = ["x-kde-passwordManagerHint"]
filter_text_min_length = 1
filter_text_max_length = 20000000
# never kept: private keys, cloud / git / chat tokens (ClipMenu hides them too)
denied_text_regex_patterns = [
    "-----BEGIN [A-Z ]*PRIVATE KEY-----",
    "\\bAKIA[0-9A-Z]{16}\\b",
    "\\bgh[pousr]_[A-Za-z0-9]{30,}",
    "\\bxox[baprs]-[A-Za-z0-9-]{10,}",
]
capture_image = true
filter_image_max_size = 5242880

[grpc]
enable_http = false
enable_local_socket = true
host = "127.0.0.1"
port = 45045
local_socket = "/run/user/1000/clipcat/grpc.sock"

[dbus]
enable = false

[metrics]
enable = false
host = "127.0.0.1"
port = 45047

[desktop_notification]
enable = false
icon = "accessories-clipboard"
timeout_ms = 2000
long_plaintext_length = 2000
