# TechOGR rice (install.sh, VMware only): no glamor acceleration.
# Xorg's modesetting driver draws with OpenGL (glamor) on VMware's SVGA3D,
# and vmwgfx crashed the kernel under it (vmw_bo_dirty_transfer_to_res,
# 2026-09-27) with a few big ARGB windows on screen: the whole session
# froze. Without glamor Xorg draws on the CPU: stable. picom keeps using
# xrender in the VM anyway (PerfProfile "lite").
Section "Device"
    Identifier  "VMware SVGA"
    Driver      "modesetting"
    Option      "AccelMethod" "none"
EndSection
